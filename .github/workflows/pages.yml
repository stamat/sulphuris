name: Deploy to GitHub Pages

# Builds the library CSS, then the site (site/) — landing page at the root,
# docs at /docs/, which is where the header "Docs" nav link points. Poops'
# copy step pulls the favicons, the logo and dist/ into site/dist, so that
# directory is the finished artifact and needs no assembling.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # Compile dist/sulphuris.css first — the site's copy step pulls it in.
      - name: Build library CSS
        run: npm run build

      # Build the docs site. --base-url lets Poops resolve absolute links
      # (sitemap, search index) under the Pages deploy path, which for a
      # project site is /<repo-name>.
      - name: Build docs
        run: npx poops -b --base-url "/${{ github.event.repository.name }}"
        working-directory: site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
