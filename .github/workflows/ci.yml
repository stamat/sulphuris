name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # typecheck, build, then the three check-*.mjs scripts over the emitted
      # CSS — this is where a generator bug shows up
      - name: Test
        run: npm test

      # dist/ is committed because the package ships it, so a source change
      # without its rebuilt CSS is an incomplete change. `npm test` has just
      # rebuilt it; if that produced a diff, the commit was missing one.
      #
      # The .map is excluded on purpose: Sass writes `file:///` source paths
      # into it, so it differs between any two checkouts and can never match.
      - name: Verify dist is up to date
        shell: bash
        run: |
          git diff --exit-code -- dist/sulphuris.css dist/sulphuris.min.css || {
            echo "dist/ does not match src/ — run script/build and commit the result" >&2
            exit 1
          }

      # The generators rewrite the reference page and the marked config blocks
      # on every build. A source change that leaves them stale is a docs bug
      # that nobody would notice until the site rebuilt.
      - name: Verify generated docs are up to date
        shell: bash
        run: |
          git diff --exit-code -- site/src/markup/docs || {
            echo "generated docs are stale — run script/build and commit the result" >&2
            exit 1
          }

  # A job of its own rather than a step in the matrix: it needs a browser, and
  # downloading one twice to run the same audit on two versions of Node buys
  # nothing — the audit runs in Chromium, not in Node.
  a11y:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # playwright-core ships no browser, which is why it is the dependency: a
      # download on every `npm ci` in the other jobs is the cost of the package
      # that bundles one.
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      # The library CSS, then the site — the audit reads the built previews, and
      # a preview links dist/sulphuris.css.
      - name: Build the library and the site
        run: script/server -b

      - name: Audit the demos with axe
        run: npm run a11y
