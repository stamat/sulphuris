{# Landing-page header. Deliberately not poops-docs-theme/topbar.html — the
   landing page is styled with Sulphuris itself, the docs are styled with the
   theme. Only the theme-switch partial is shared between them. #}
<header class="bg-primary border-b">
  <div class="container py-24 d-flex align-center">
    <div class="h5 d-flex align-center">
      <img src="{{ relativePathPrefix }}{{ site.logo }}" alt="{{ site.brandMark }}" height="22" width="18" class="w-100p h-auto mr-8 darkmode-invert" style="max-width: 18px;">
      {{ site.brand }}
      <a href="https://www.npmjs.com/package/{{ package.name }}"><img class="ml-8 ml-lg-16 d-block" src="https://img.shields.io/npm/v/{{ package.name }}" alt="npm version" style="max-width: 100%;"></a>
    </div>
    <div class="ml-auto h6 d-flex align-center">
      <a href="{{ relativePathPrefix }}docs/" class="opacity-hover text-foreground font-bold text-none d-flex align-center ml-lg-24 ml-16"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="20" height="20" aria-hidden="true"><path d="M0 1.75A.75.75 0 0 1 .75 1h4.253c1.227 0 2.317.59 3 1.501A3.743 3.743 0 0 1 11.006 1h4.245a.75.75 0 0 1 .75.75v10.5a.75.75 0 0 1-.75.75h-4.507a2.25 2.25 0 0 0-1.591.659l-.622.621a.75.75 0 0 1-1.06 0l-.622-.621A2.25 2.25 0 0 0 5.258 13H.75a.75.75 0 0 1-.75-.75Zm7.251 10.324.004-5.073-.002-2.253A2.25 2.25 0 0 0 5.003 2.5H1.5v9h3.757a3.75 3.75 0 0 1 1.994.574ZM8.755 4.75l-.004 7.322a3.752 3.752 0 0 1 1.992-.572H14.5v-9h-3.495a2.25 2.25 0 0 0-2.25 2.25Z" fill="currentColor"></path></svg> <span class="ml-4 border-b border-2 pb-2">Docs</span></a>
      <a href="{{ site.repo }}" class="opacity-hover text-foreground font-bold text-none d-flex align-center ml-lg-24 ml-16"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="20" height="20" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z" fill="currentColor"></path></svg> <span class="ml-4 border-b border-2 pb-2">Repo</span></a>
      {% include "theme-switch.html" %}
    </div>
  </div>
</header>
